<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — LLM Toolkit</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: var(--color-bg); color: var(--color-text); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: var(--font-sans);">
  <div style="text-align: center; padding: var(--space-12);">
    <div style="font-family: var(--font-mono); font-size: var(--text-6xl); font-weight: 700; letter-spacing: var(--tracking-wider); color: var(--color-text-tertiary);">404</div>
    <h1 style="margin-top: var(--space-4);">Page Not Found</h1>
    <p style="color: var(--color-text-secondary); margin-top: var(--space-4);">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn btn-primary mt-8" style="display: inline-flex;">Return Home</a>
  </div>
</body>
</html>
