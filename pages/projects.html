<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — LLM Toolkit</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/learning.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <div class="site-wrapper">
    <aside class="sidebar" id="sidebar"><div class="sidebar-logo"><h2>llm.effnine.dev</h2><p>Training &amp; Engineering Toolkit</p></div><nav class="sidebar-nav" id="sidebar-nav"></nav><div class="sidebar-footer"><a href="/pages/reference.html">Reference</a></div></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <header class="top-nav">
      <button class="hamburger" id="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <div class="nav-brand">LLM <span>Toolkit</span></div>
      <div class="nav-actions"><button class="nav-search-btn" id="nav-search-btn"><span>Search</span><kbd>/</kbd></button></div>
    </header>
    <main class="main-content">
      <div class="page-header narrow">
        <div class="breadcrumbs"><a href="/">Home</a><span class="sep">/</span><span>Projects</span></div>
        <h1>Hands-on Projects</h1>
        <p style="margin-top: var(--space-4);">Build real LLMs step by step. Each project teaches a key concept through implementation.</p>
      </div>
      <div class="page-content narrow">
        <div id="projects-list" class="mt-4"></div>
        <div id="project-detail" style="display:none;" class="mt-4"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/js/storage.js"></script>
  <script type="module" src="/js/router.js"></script>
  <script type="module" src="/js/navigation.js"></script>
  <script type="module" src="/js/search.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script>
    const Projects = {
      async init() {
        try {
          const mod = await import('../data/projects.json');
          window.PROJECTS = mod.default || mod;
        } catch { window.PROJECTS = []; }
        this.renderList();
      },
      renderList() {
        const el = document.getElementById('projects-list');
        if (!el || !window.PROJECTS) return;
        
        el.innerHTML = window.PROJECTS.map((p, i) => `
          <div class="card mb-4" style="cursor:pointer;" onclick="Projects.show(${i})">
            <div class="flex justify-between items-center">
              <div>
                <div class="uppercase text-tertiary text-xs tracking-wider mb-1">Project ${String(i+1).padStart(2,'0')}</div>
                <h3 style="font-size: var(--text-lg);">${p.title}</h3>
                <p class="text-sm text-muted mt-1">${p.objective}</p>
              </div>
              <div class="text-right">
                <span class="badge">${p.estimatedHours}h</span>
                <div class="text-xs text-tertiary mt-1">${p.difficulty}</div>
              </div>
            </div>
          </div>
        `).join('');
      },
      show(idx) {
        const p = window.PROJECTS[idx];
        if (!p) return;
        
        const listEl = document.getElementById('projects-list');
        const detailEl = document.getElementById('project-detail');
        if (!listEl || !detailEl) return;
        
        listEl.style.display = 'none';
        detailEl.style.display = 'block';
        
        const prereqs = (p.prerequisites || []).map(id => `<span class="prereq-tag">${id}</span>`).join('');
        
        detailEl.innerHTML = `
          <div class="breadcrumbs"><a href="#" onclick="Projects.back();return false;">Projects</a><span class="sep">/</span><span>${p.title}</span></div>
          <h2>${p.title}</h2>
          <div class="topic-meta mt-4">
            <span class="difficulty-badge difficulty-${p.difficulty}">${p.difficulty}</span>
            <span class="badge">${p.estimatedHours} hours</span>
          </div>
          
          <div class="grid-2 mt-6" style="gap: var(--space-6);">
            <div>
              <div class="section-title">OBJECTIVE</div>
              <p>${p.objective}</p>
            </div>
            <div>
              <div class="section-title">PREREQUISITES</div>
              <div class="topic-prerequisites">${prereqs || '<span class="text-muted text-sm">None</span>'}</div>
            </div>
          </div>
          
          <div class="grid-2 mt-6" style="gap: var(--space-6);">
            <div>
              <div class="section-title">HARDWARE</div>
              <p class="text-sm">${p.hardware}</p>
            </div>
            <div>
              <div class="section-title">SOFTWARE</div>
              <p class="text-sm">${p.software}</p>
            </div>
          </div>
          
          <div class="mt-6">
            <div class="section-title">IMPLEMENTATION STEPS</div>
            <ol style="padding-left: var(--space-6); font-size: var(--text-sm); color: var(--color-text-secondary);">
              ${p.steps.map(s => `<li style="margin-bottom: var(--space-2);">${s}</li>`).join('')}
            </ol>
          </div>
          
          <div class="mt-6">
            <div class="section-title">CONFIGURATION</div>
            <pre>${JSON.stringify(p.config, null, 2)}</pre>
          </div>
          
          <div class="mt-6">
            <div class="section-title">EXPECTED RESULTS</div>
            <p class="text-sm">${p.expectedResults}</p>
          </div>
          
          <div class="mt-6">
            <div class="section-title">TROUBLESHOOTING</div>
            <p class="text-sm">${p.troubleshooting}</p>
          </div>
          
          ${p.nextProject ? `
          <div class="topic-nav mt-8">
            <button class="btn btn-secondary" onclick="Projects.back()">← Back</button>
            <button class="btn btn-primary" onclick="Projects.next(${idx})">Next Project →</button>
          </div>
          ` : `
          <div class="mt-8">
            <button class="btn btn-secondary" onclick="Projects.back()">← Back to Projects</button>
          </div>
          `}
        `;
      },
      back() {
        const listEl = document.getElementById('projects-list');
        const detailEl = document.getElementById('project-detail');
        if (listEl) listEl.style.display = 'block';
        if (detailEl) detailEl.style.display = 'none';
      },
      next(idx) {
        if (idx < (window.PROJECTS?.length || 0) - 1) {
          this.show(idx + 1);
        }
      }
    };
    window.Projects = Projects;
    window.renderProjects = async () => { await Projects.init(); };
  </script>
</body>
</html>
